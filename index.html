//  Core rule: the light you SEE is the light that CATCHES you.
//  Rendering and detection both use the same light geometry
//  (visibility polygon + cone + falloff), so they can never disagree.
// =====================================================================

const VIEW_W = 960, VIEW_H = 540, T = 32;

const TUNE = {
  gravity: 1800, maxFall: 1100,
  walk: 140, run: 260, crawl: 70, cling: 80,
  accelGround: 1600, accelAir: 900,
  // Limbo-style weight: speed builds slowly, then picks up (seconds to full speed), and eases to a stop
  rampRun: 0.9, rampWalk: 0.6, rampCrawl: 0.4, rampCling: 0.5,
  rampFloor: 0.08,                   // the first step starts at 8% of full speed
  decel: 1400,                       // stopping / turning: about 0.2s from a full run
  jumpV: 640, jumpCut: 1.2,          // extra gravity while rising with jump released
  coyote: 0.08, jumpBuffer: 0.12,
  width: 18, standH: 44, crawlH: 20,
  ambient: 0.42,                     // how bright "darkness" is in the lightmap (0..1)
  fillRate: 0.38,                    // meter per second at full exposure
  drainDelay: 1.2, drainRate: 0.12,  // seconds in shadow before draining, drain per second
  exposedThreshold: 0.03,
  landNoiseV: 600,                   // landings faster than this are loud (drops of up to 3 tiles are quiet)
  flipTime: 0.65,                    // pulling a lever: the ninja stops, reaches, pulls
  leverReach: 48,                    // a lever this close (px, either side) is pulled; he steps over to it first
};
// Meter bands - guards (milestone 3) will react to these.
const METER_SUSPICIOUS = 0.35, METER_ALERT = 0.65;

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const wrapAngle = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = VIEW_W; cv.height = VIEW_H;

//            TUNE.leverReach, so keep a lever within that of any wall) and the

// ---------- the current floor (filled in by loadLevel) ----------
let LH = 17;                                       // this floor's height in rows (tall floors scroll vertically)
let exitRow = 15, switches = [], doors = [];       // doors: {x, y, w, h, open}; switches: {x, row, door, on, anim}
let LW = 100, grid = new Uint8Array(0), level = null, levelIdx = 0, levelT = 0;
let notice = '', noticeT = 99;                     // a line that fades in mid-screen, e.g. "a door unlocks below."
let SPAWN = { x: 0, y: 0 }, EXIT_X = 0, DOOR_X = 0, PROPS = [], HINTS = [], GUARD_DEFS = [];
function fill(x, y, w, h, v = 1) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) grid[j * LW + i] = v;
}
// Above the map is open sky (so skylights let moonlight in); sides and below are solid.
function solidAt(i, j) {
  if (j < 0) return false;
  if (i < 0 || i >= LW || j >= LH) return true;
  return grid[j * LW + i] !== 0;
}
// Ducts (2) are solid like walls, and their underside is something you can cling to.
const GRIP = 2;
const DOOR = 3;                                     // a locked door: solid until its switch is pulled
const isGrip = (i, j) => i >= 0 && i < LW && j >= 0 && j < LH && grid[j * LW + i] === GRIP;

// Furniture. Duck (↓) behind anything with a width to hide from light.
const PROP_W = { desk: 70, plant: 26, cooler: 26, rack: 40 };

// ---------- occluder segments: merged tile edges ----------
function buildSegments() {
  const segs = [];
  for (let y = 0; y <= LH; y++) {          // horizontal edges
    let start = 0, type = 0;
    for (let x = 0; x <= LW; x++) {
      let t = 0;
      if (x < LW) { const a = solidAt(x, y - 1), b = solidAt(x, y); if (a !== b) t = b ? 1 : 2; }
      if (t !== type) { if (type) segs.push({ ax: start * T, ay: y * T, bx: x * T, by: y * T }); type = t; start = x; }
    }
  }
  for (let x = 0; x <= LW; x++) {          // vertical edges
    let start = 0, type = 0;
    for (let y = 0; y <= LH; y++) {
      let t = 0;
      if (y < LH) { const a = solidAt(x - 1, y), b = solidAt(x, y); if (a !== b) t = b ? 1 : 2; }
      if (t !== type) { if (type) segs.push({ ax: x * T, ay: start * T, bx: x * T, by: y * T }); type = t; start = y; }
    }
  }
  return segs;
}
let SEGS = [];

// Ray (p + t*d) vs segment; returns t (in units of d) or Infinity.
function raySeg(px, py, dx, dy, s) {
  const ex = s.bx - s.ax, ey = s.by - s.ay;
  const den = dx * ey - dy * ex;
  if (Math.abs(den) < 1e-9) return Infinity;
  const sx = s.ax - px, sy = s.ay - py;
  const t = (sx * ey - sy * ex) / den;
  const u = (sx * dy - sy * dx) / den;
  return (t > 0 && u >= 0 && u <= 1) ? t : Infinity;
}
function blocked(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  for (const s of SEGS) { const t = raySeg(ax, ay, dx, dy, s); if (t > 1e-4 && t < 1 - 1e-4) return true; }
  return false;
}
// Everything a light at (lx,ly) can see within radius r, as an angle-sorted polygon.
function visibilityPolygon(lx, ly, r) {
  const x0 = lx - r, y0 = ly - r, x1 = lx + r, y1 = ly + r;
  const segs = SEGS.filter(s => Math.max(s.ax, s.bx) >= x0 && Math.min(s.ax, s.bx) <= x1 &&
                                Math.max(s.ay, s.by) >= y0 && Math.min(s.ay, s.by) <= y1);
  segs.push({ ax: x0, ay: y0, bx: x1, by: y0 }, { ax: x1, ay: y0, bx: x1, by: y1 },
            { ax: x1, ay: y1, bx: x0, by: y1 }, { ax: x0, ay: y1, bx: x0, by: y0 });
  const angles = [];
  for (const s of segs) for (const [px, py] of [[s.ax, s.ay], [s.bx, s.by]]) {
    const a = Math.atan2(py - ly, px - lx); angles.push(a - 1e-4, a, a + 1e-4);
  }
  const pts = [];
  for (const a of angles) {
    const dx = Math.cos(a), dy = Math.sin(a);
    let best = Infinity;
    for (const s of segs) { const t = raySeg(lx, ly, dx, dy, s); if (t < best) best = t; }
    if (best < Infinity) pts.push({ a, x: lx + dx * best, y: ly + dy * best });
  }
  pts.sort((p, q) => p.a - q.a);
  return pts;
}

// =====================================================================
//  LIGHTS
// =====================================================================
const STOPS_LAMP = [[0, 1], [0.5, 0.85], [0.8, 0.5], [1, 0]];
const STOPS_FLAT = [[0, 1], [1, 1]];
const CONE_SOFT = [1];              // one hard-edged cone, for render AND detection ([0.82, 1, 1.15] = soft edge)

function falloff(stops, t) {
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, v0] = stops[i - 1], [t1, v1] = stops[i];
    return lerp(v0, v1, (t - t0) / (t1 - t0));
  }
  return 0;
}
function light(o) {
  const L = Object.assign({ kind: 'lamp', dir: Math.PI / 2, spread: 0.5, radius: 420, intensity: 1,
                            stops: STOPS_LAMP, flicker: null, level: 1, danger: 1 }, o);
  L.poly = visibilityPolygon(L.x, L.y, L.radius);   // world is static, so cache it
  return L;
}
const CEIL_Y = 2 * T + 4;
let LIGHTS = [];
function makeLevelLight(d) {
  let L;
  if (d.kind === 'moon') {                         // through a skylight gap, from far above
    const cx = (d.gap + 1) * T, ox = cx - 150, oy = -420;
    L = light({ kind: 'moon', x: ox, y: oy, dir: Math.atan2(2 * T - oy, cx - ox), spread: 0.3,
                radius: 1150, intensity: 0.45, stops: STOPS_FLAT });
  } else if (d.kind === 'sign') {
    L = light({ kind: 'sign', x: d.x * T, y: (exitRow - 4) * T + 20, dir: 0, spread: Math.PI, radius: 170, intensity: 0.35 });
  } else {                                         // lamp / camera: on the ceiling unless a y is given
    L = light({ kind: d.kind, x: d.x * T, y: d.y !== undefined ? d.y * T : CEIL_Y, dir: d.dir ?? Math.PI / 2,
                spread: d.spread, radius: d.radius, intensity: d.intensity ?? 1, danger: d.danger ?? 1 });
  }
  if (d.flicker) L.flicker = { period: d.flicker[0], on: d.flicker[1] };
  if (d.sweep) { L.sweep = { amp: d.sweep[0], period: d.sweep[1] }; L.baseDir = L.dir; L.alarmT = -99; L.seeing = false; }
  return L;
}

function updateLight(L, t) {
  if (L.sweep) L.dir = L.baseDir + L.sweep.amp * Math.sin(2 * Math.PI * t / L.sweep.period);   // cameras sweep
  if (!L.flicker) { L.level = L.intensity; return; }
  const ph = (t % L.flicker.period) / L.flicker.period;
  let lit = ph < L.flicker.on;
  if (ph < 0.07) lit = Math.sin(t * 90) > 0.2;                          // sputters on
  else if (ph > L.flicker.on - 0.03 && ph < L.flicker.on) lit = Math.sin(t * 70) > 0;
  L.level = lit ? L.intensity : 0;
}

// How much of light L reaches point (px,py), 0..1. Mirrors drawLight exactly.
function lightAt(L, px, py) {
  if (L.level <= 0) return 0;
  const dx = px - L.x, dy = py - L.y, d2 = dx * dx + dy * dy;
  if (d2 >= L.radius * L.radius) return 0;
  const ang = Math.abs(wrapAngle(Math.atan2(dy, dx) - L.dir));
  let cone = 0;
  for (const k of CONE_SOFT) if (ang <= L.spread * k) cone++;
  if (!cone) return 0;
  if (blocked(L.x, L.y, px, py)) return 0;
  return L.level * falloff(L.stops, Math.sqrt(d2) / L.radius) * cone / CONE_SOFT.length;
}

function drawLight(c, L, alphaScale) {
  if (L.level <= 0) return;
  const g = c.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.radius);
  for (const [t, v] of L.stops) g.addColorStop(t, `rgba(255,255,255,${v * L.level * alphaScale / CONE_SOFT.length})`);
  c.save();
  c.beginPath();
  c.moveTo(L.poly[0].x, L.poly[0].y);
  for (let i = 1; i < L.poly.length; i++) c.lineTo(L.poly[i].x, L.poly[i].y);
  c.closePath();
  c.clip();
  c.fillStyle = g;
  for (const k of CONE_SOFT) {
    const s = L.spread * k;
    c.beginPath();
    if (s >= Math.PI) c.arc(L.x, L.y, L.radius, 0, Math.PI * 2);
    else { c.moveTo(L.x, L.y); c.arc(L.x, L.y, L.radius, L.dir - s, L.dir + s); c.closePath(); }
    c.fill();
  }
  c.restore();
}
const lightInView = (L, cx, cy) =>
  L.x + L.radius > cx && L.x - L.radius < cx + VIEW_W && L.y + L.radius > cy && L.y - L.radius < cy + VIEW_H;

// =====================================================================
//  PARALLAX LAYERS (pre-rendered) - far city, mid office wall, foreground
// =====================================================================
const PAR_FAR = 0.18, PAR_MID = 0.5, PAR_FG = 1.35;
const layerWidth = f => Math.ceil(VIEW_W + (LW * T - VIEW_W) * f) + 60;
const PAR_FAR_Y = 0.2, PAR_MID_Y = 0.5;            // tall floors: vertical drift of the far and mid layers
const layerHeight = f => Math.ceil(VIEW_H + (LH * T - VIEW_H) * f) + 60;

function makeFar() {
  const c = document.createElement('canvas'); c.width = layerWidth(PAR_FAR); c.height = layerHeight(PAR_FAR_Y);
  const g = c.getContext('2d'), r = rng(11);
  g.fillStyle = '#ececec'; g.beginPath(); g.arc(c.width * 0.62, 120, 34, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#bdbdbd';
  for (let x = -20; x < c.width;) { const bw = 30 + r() * 70, bh = 60 + r() * 120; g.fillRect(x, 470 - bh, bw, c.height - 470 + bh); x += bw + r() * 6; }
  for (let x = -30; x < c.width;) {
    const bw = 40 + r() * 90, bh = 120 + r() * 250, top = 470 - bh;
    g.fillStyle = '#9a9a9a'; g.fillRect(x, top, bw, c.height - top);
    if (r() < 0.25) g.fillRect(x + bw / 2 - 1, top - 40, 2, 40);
    if (r() < 0.55) {
      g.fillStyle = '#c4c4c4';
      for (let wy = top + 10; wy < 460; wy += 14) for (let wx = x + 6; wx < x + bw - 6; wx += 10) if (r() < 0.18) g.fillRect(wx, wy, 4, 6);

// =====================================================================
//  DETECTION

// =====================================================================
//  NOISE + STONES

// =====================================================================

      const sel = i === quitSel;
      ctx.font = '20px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillStyle = `rgba(255,255,255,${sel ? 0.95 : 0.42})`;
      ctx.fillText(label, QUIT_X[i], QUIT_Y);
      if (sel) ctx.fillRect(QUIT_X[i] - 22, QUIT_Y + 10, 44, 1);
    });
    ctx.textAlign = 'left';
    footer('← →  choose    ·    ENTER  select    ·    ESC  back');
    return;
  }
  if (menuPage === 'levels') {
    centerText('LEVELS', 150, '30px Georgia, serif', 0.9, '10px');
    LEVELS.forEach((L, i) => {
      const y = LEVELS_Y + i * MENU_DY, sel = i === levelSel, label = `${L.name}   ·   ${L.subtitle}`;
      centerText(label, y, '18px Georgia, serif', sel ? 0.95 : 0.42, '3px');
      if (sel) {
        ctx.font = '18px Georgia, serif'; ctx.letterSpacing = '3px';
        const half = ctx.measureText(label).width / 2; ctx.letterSpacing = '0px';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(VIEW_W / 2 - half - 44, y - 6, 28, 1); ctx.fillRect(VIEW_W / 2 + half + 16, y - 6, 28, 1);
      }
    });
    footer('↑ ↓  choose    ·    ENTER  play    ·    ESC  back');
    return;
  }
  if (menuPage === 'about') {
    centerText('ABOUT', 80, '30px Georgia, serif', 0.9, '10px');
    ABOUT.forEach((line, i) => centerText(line, 125 + i * 22, 'italic 15px Georgia, serif', 0.75));
    centerText('CONTROLS', 275, '13px Georgia, serif', 0.55, '6px');
    drawTable(305);
    centerText('a greyscale stealth prototype, after Limbo and Mark of the Ninja', 482, 'italic 12px Georgia, serif', 0.4);
    footer('ESC  back');
    return;
  }
  if (menuPage === 'controls') {
    centerText('CONTROLS', 120, '30px Georgia, serif', 0.9, '10px');
    drawTable(190);
    footer('ESC  back');
    return;
  }
  centerText('SHADOW NINJA', 165, '54px Georgia, serif', 0.92, '14px');
  centerText(paused ? 'paused' : 'stay out of the light', 205, 'italic 18px Georgia, serif', 0.6);
  menuItems().forEach((item, i) => {
    const y = MENU_Y + i * MENU_DY, sel = i === menuSel, label = item.toUpperCase();
    centerText(label, y, '20px Georgia, serif', sel ? 0.95 : 0.42, '5px');
    if (sel) {                                     // short rules either side of the chosen item
      ctx.font = '20px Georgia, serif'; ctx.letterSpacing = '5px';
      const half = ctx.measureText(label).width / 2; ctx.letterSpacing = '0px';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(VIEW_W / 2 - half - 44, y - 7, 28, 1); ctx.fillRect(VIEW_W / 2 + half + 16, y - 7, 28, 1);
    }
  });
  footer('↑ ↓  choose    ·    ENTER  select' + (paused ? '    ·    ESC  resume' : ''));
}
function drawOverlay() {
  if (state === 'title' || state === 'pause') drawMenu(state === 'pause');
  else if (state === 'bye') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    centerText('thanks for playing', 260, 'italic 28px Georgia, serif', 0.85);
    centerText('you can close this tab now   ·   ENTER  back to the menu', 305, '13px Georgia, serif', 0.5, '2px');
  } else if (state === 'caught') {
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - stateT * 3)})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.78, stateT * 1.2)})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    if (stateT > 0.4) {
      centerText('CAUGHT', 260, '56px Georgia, serif', 0.92, '16px');
      centerText('the meter filled.', 305, 'italic 16px Georgia, serif', 0.6);
      centerText('R  try again    ·    ESC  menu', 345, '13px Georgia, serif', 0.5, '2px');
    }
  } else if (state === 'escaped') {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.8, stateT)})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    if (stateT > 0.5) {
      if (levelIdx + 1 >= LEVELS.length) {
        centerText('OUT', 260, '56px Georgia, serif', 0.92, '16px');
        centerText('you made it out of the tower.', 305, 'italic 16px Georgia, serif', 0.6);
        centerText('ENTER  menu    ·    R  replay this floor', 345, '13px Georgia, serif', 0.5, '2px');
      } else {
        centerText(level.name + '  CLEARED', 260, '40px Georgia, serif', 0.92, '12px');
        centerText('down the stairs, into the dark.', 300, 'italic 16px Georgia, serif', 0.6);
        centerText('ENTER  next floor    ·    R  replay this floor    ·    ESC  menu', 345, '13px Georgia, serif', 0.5, '2px');
      }
    }
  }
}

function render() {
  const cx = Math.round(cam.x), cy = Math.round(cam.y);
  const showPlayer = state !== 'title' && state !== 'bye';
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  // back to front: fog, far city, mid office wall
  ctx.fillStyle = fogGrad; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.drawImage(farCv, -Math.round(cx * PAR_FAR), -Math.round(cy * PAR_FAR_Y));
  ctx.drawImage(midCv, -Math.round(cx * PAR_MID), -Math.round(cy * PAR_MID_Y));

  // main layer
  ctx.save(); ctx.translate(-cx, -cy);
  drawTiles(cx); drawDoor(); drawSecurityDoors();
  if (showPlayer && P.hidden) drawNinja();          // hidden: furniture draws over you
  for (const p of PROPS) drawProp(p);
  drawFixtures(); drawLevers();
  for (const g of guards) drawGuard(g);
  if (showPlayer && !P.hidden) drawNinja();
  ctx.restore();

  // lighting: multiply the lightmap, then a soft haze for visible light shafts
  buildLightmap(cx, cy);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(lightCv, 0, 0);
  ctx.globalCompositeOperation = 'screen';
  ctx.save(); ctx.translate(-cx, -cy);
  for (const L of allLights()) if (lightInView(L, cx, cy)) drawLight(ctx, L, 0.2);
  drawBulbs();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save(); ctx.translate(-cx, -cy);
  drawHints(); drawExitSign(); drawCameraLeds(); drawStatusLights();
  if (showPlayer && P.cover && !P.hidden) {         // nudge: you could hide here
    ctx.font = '13px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('↓', P.cover.x * T + PROP_W[P.cover.type] / 2, P.cover.y - 66);
    ctx.textAlign = 'left';
  }
  if (showPlayer) drawEyes();
  drawNoiseAndStones();
  drawGuardMarks();
  if (debug) drawDebug();
  ctx.restore();

  // foreground silhouettes sweep past faster than the world
  ctx.drawImage(fgCv, -Math.round(cx * PAR_FG), 0);

  // aim arc + cursor on top of everything in the world (the system cursor is hidden while playing)
  ctx.save(); ctx.translate(-cx, -cy); drawAim(); ctx.restore();
  const cursor = state === 'play' ? 'none' : 'default';
  if (cv.style.cursor !== cursor) cv.style.cursor = cursor;

  // film grain + vignette (+ heartbeat as the meter climbs)
  ctx.save(); ctx.globalAlpha = 0.06;
  ctx.translate(Math.random() * 256 | 0, Math.random() * 256 | 0);
  ctx.fillStyle = grainPattern; ctx.fillRect(-256, -256, VIEW_W + 256, VIEW_H + 256);
  ctx.restore();
  ctx.drawImage(vignetteCv, 0, 0);
  if (showPlayer && meter > METER_AUDIO.heartFrom) {   // the red-edge pulse: one throb per heartbeat
    const k = clamp((meter - METER_AUDIO.heartFrom) / (1 - METER_AUDIO.heartFrom), 0, 1);
    ctx.globalAlpha = (0.35 + 0.65 * k) * Math.exp(-(time - lastBeat) * 5);
    ctx.drawImage(vignetteCv, 0, 0); ctx.globalAlpha = 1;
  }

  if (showPlayer) drawHUD();
  if (debug) {
    ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`fps ${fps.toFixed(0)}  exposure ${exposure.toFixed(2)}  meter ${meter.toFixed(2)}`, 28, VIEW_H - 18);
  }
  drawOverlay();
}

// =====================================================================
//  LOOP - fixed 60 Hz simulation
// =====================================================================
const DT = 1 / 60;
let acc = 0, last = performance.now(), fps = 60;
function frame(now) {
  const elapsed = Math.min(0.1, (now - last) / 1000); last = now;
  fps = lerp(fps, 1 / Math.max(elapsed, 1e-3), 0.05);
  acc += elapsed;
  while (acc >= DT) { step(DT); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
loadLevel(0); startRun(); state = 'title';
requestAnimationFrame(frame);
</script>
</body>
</html>
